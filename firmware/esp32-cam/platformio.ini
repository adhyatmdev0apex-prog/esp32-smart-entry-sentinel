[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino

board_build.partitions = min_spiffs.csv

upload_speed = 1000000
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -DBOARD_AI_THINKER_CAM
    -I boards

[env:esp32wroom]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    -DBOARD_ESP32_WROOM
    -I boards
