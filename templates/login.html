<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoorCam Access — Sign In</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1120;
            --card: #111827;
            --border: rgba(148, 163, 184, 0.22);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #172554 0%, var(--bg) 55%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 390px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .brand-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, #2563eb, #06b6d4);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 16px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
        }

        .sub {
            color: var(--muted);
            font-size: 0.85rem;
            margin: 0 0 22px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 16px;
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 31px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.78rem;
            padding: 4px 6px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .err {
            background: rgba(248, 113, 113, 0.14);
            border: 1px solid rgba(248, 113, 113, 0.35);
            color: var(--danger);
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 0.83rem;
            margin-bottom: 14px;
        }

        .roles {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid rgba(148, 163, 184, 0.14);
            font-size: 0.76rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand">
            <div class="brand-badge">DC</div>
            <h1>Smart Door Dashboard</h1>
        </div>
        <p class="sub">Sign in with your <strong>ADmin</strong> or <strong>user</strong> credentials</p>

        {% if error %}
        <div class="err">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" placeholder="username.."
                    required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password"
                    placeholder="Enter password" required>
                <button type="button" class="toggle-pw"
                    onclick="const p=document.getElementById('password');const s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Hide':'Show';">Show</button>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="roles">
            Credentials are read from <code>firmware/esp32-cam/include/secrets.h</code>
        </div>
    </div>
</body>

</html>
